<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HP Stencil Studio Pro - Master Edition</title>
  <style>
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --accent: #6366f1;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
      user-select: none;
    }
    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 1.6rem; }
    p.sub { color: var(--muted); font-size: 0.85rem; }

    .main-layout {
      width: 100%;
      max-width: 1350px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      height: calc(100vh - 90px);
    }

    .sidebar {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      overflow-y: auto;
    }

    .layer-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .layer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slider-group label {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .tool-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tool-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #2a2a32;
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .tool-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .file-input-wrapper { position: relative; width: 100%; }
    .file-input-wrapper input[type="file"] {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
    }

    .viewport {
      background: #0d0d0f;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .viewport-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(30, 30, 36, 0.85);
      backdrop-filter: blur(8px);
      padding: 6px 10px;
      border-radius: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .vp-btn {
      background: transparent;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .vp-btn:hover { background: rgba(255,255,255,0.1); }
    .zoom-text { font-size: 0.8rem; color: var(--muted); min-width: 45px; text-align: center; }

    #canvasWrapper {
      position: absolute;
      transform-origin: 0 0;
      cursor: crosshair;
    }
    canvas {
      display: block;
      background: white;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <header>
    <h1>✒️ HP Stencil Studio Pro</h1>
    <p class="sub">Többrétegű stencilkészítő, átvilágító asztal (Lightbox) & nagyító funkcióval</p>
  </header>

  <div class="main-layout">
    <!-- BAL OLDAL -->
    <div class="sidebar">
      <div class="file-input-wrapper">
        <button class="btn" style="width: 100%;">📁 Kép betallózása</button>
        <input type="file" id="imageLoader" accept="image/*">
      </div>

      <!-- ÁTVILÁGÍTÓ ASZTAL (LIGHTBOX) -->
      <div class="layer-card" style="border-color: #f59e0b;">
        <div class="layer-header">
          <span>💡 Átvilágító (Eredeti kép átlátszósága)</span>
        </div>
        <div class="slider-group">
          <label>Háttér átfedés: <span id="lightboxVal">0%</span></label>
          <input type="range" id="lightbox" min="0" max="100" value="0">
        </div>
      </div>

      <!-- 1. RÉTEG: FŐ KONTÚR -->
      <div class="layer-card">
        <div class="layer-header">
          <span>1. Fő körvonalak (Vastag tű)</span>
          <input type="checkbox" id="layer1_enable" checked>
        </div>
        <div class="slider-group">
          <label>Érzékenység: <span id="l1_thresh_val">40</span></label>
          <input type="range" id="l1_thresh" min="10" max="100" value="40">
        </div>
        <div class="slider-group">
          <label>Vonalvastagság: <span id="l1_thick_val">2</span></label>
          <input type="range" id="l1_thick" min="1" max="4" value="2">
        </div>
      </div>

      <!-- 2. RÉTEG: MIKRORÉSZLETEK -->
      <div class="layer-card">
        <div class="layer-header">
          <span>2. Mikrorészletek (Finom tű)</span>
          <input type="checkbox" id="layer2_enable" checked>
        </div>
        <div class="slider-group">
          <label>Részlet erősség: <span id="l2_thresh_val">25</span></label>
          <input type="range" id="l2_thresh" min="5" max="80" value="25">
        </div>
        <div class="slider-group">
          <label>Átlátszatlanság: <span id="l2_opacity_val">60%</span></label>
          <input type="range" id="l2_opacity" min="0" max="100" value="60">
        </div>
      </div>

      <!-- RETUS ÉS ESZKÖZÖK -->
      <div class="layer-card">
        <div class="layer-header">
          <span>🖌️ Szerkesztő eszközök</span>
        </div>
        <div class="tool-group">
          <button id="tool_eraser" class="tool-btn active">🧽 Radír</button>
          <button id="tool_brush" class="tool-btn">✏️ Toll</button>
          <button id="tool_pan" class="tool-btn">✋ Mozgatás</button>
        </div>
        <div class="slider-group" style="margin-top:6px;">
          <label>Eszköz mérete: <span id="brushSizeVal">16px</span></label>
          <input type="range" id="brushSize" min="2" max="80" value="16">
        </div>
        <div class="tool-group" style="margin-top:6px;">
          <button id="flipBtn" class="tool-btn">🪞 Tükrözés (H)</button>
          <button id="undoBtn" class="tool-btn" style="background:#374151;">↩️ Visszavonás</button>
        </div>
      </div>

      <button id="downloadBtn" class="btn" style="background:var(--success); margin-top:auto;" disabled>💾 Tiszta Stencil Mentése</button>
    </div>

    <!-- JOBB OLDAL: ZOOMOLHATÓ VÁSZON -->
    <div class="viewport" id="viewport">
      <div class="viewport-toolbar">
        <button class="vp-btn" id="zoomOut">➖</button>
        <span class="zoom-text" id="zoomVal">100%</span>
        <button class="vp-btn" id="zoomIn">➕</button>
        <button class="vp-btn" id="zoomReset" title="Igazítás ablakhoz">🎯</button>
      </div>

      <div id="canvasWrapper">
        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    const imageLoader = document.getElementById('imageLoader');
    const viewport = document.getElementById('viewport');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // Slider elemek
    const l1Enable = document.getElementById('layer1_enable');
    const l1Thresh = document.getElementById('l1_thresh');
    const l1Thick = document.getElementById('l1_thick');
    const l2Enable = document.getElementById('layer2_enable');
    const l2Thresh = document.getElementById('l2_thresh');
    const l2Opacity = document.getElementById('l2_opacity');
    const lightboxSlider = document.getElementById('lightbox');

    // Érték kiírók
    const l1ThreshVal = document.getElementById('l1_thresh_val');
    const l1ThickVal = document.getElementById('l1_thick_val');
    const l2ThreshVal = document.getElementById('l2_thresh_val');
    const l2OpacityVal = document.getElementById('l2_opacity_val');
    const lightboxVal = document.getElementById('lightboxVal');
    const brushSizeVal = document.getElementById('brushSizeVal');
    const zoomVal = document.getElementById('zoomVal');

    // Eszközök
    const toolEraser = document.getElementById('tool_eraser');
    const toolBrush = document.getElementById('tool_brush');
    const toolPan = document.getElementById('tool_pan');
    const brushSizeSlider = document.getElementById('brushSize');
    const flipBtn = document.getElementById('flipBtn');
    const undoBtn = document.getElementById('undoBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // Zoom gombok
    const zoomInBtn = document.getElementById('zoomIn');
    const zoomOutBtn = document.getElementById('zoomOut');
    const zoomResetBtn = document.getElementById('zoomReset');

    let originalImage = null;
    let grayData = null;
    let isFlipped = false;

    // Kézi retus réteg puffer
    let manualLayerCanvas = document.createElement('canvas');
    let manualCtx = manualLayerCanvas.getContext('2d');
    let undoHistory = [];

    // Zoom & Pan állapot
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let isDrawing = false;
    let startPanX = 0, startPanY = 0;
    let currentTool = 'eraser'; // 'eraser' | 'brush' | 'pan'

    imageLoader.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          originalImage = img;
          isFlipped = false;
          canvas.width = img.width;
          canvas.height = img.height;

          manualLayerCanvas.width = img.width;
          manualLayerCanvas.height = img.height;
          manualCtx.clearRect(0, 0, img.width, img.height);
          undoHistory = [];

          computeGrayscale();
          resetZoomFit();
          renderFullStencil();
          downloadBtn.disabled = false;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function computeGrayscale() {
      ctx.save();
      if (isFlipped) {
        ctx.scale(-1, 1);
        ctx.drawImage(originalImage, -canvas.width, 0);
      } else {
        ctx.drawImage(originalImage, 0, 0);
      }
      ctx.restore();

      const src = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      grayData = new Float32Array(canvas.width * canvas.height);
      for (let i = 0, j = 0; i < src.length; i += 4, j++) {
        grayData[j] = 0.299 * src[i] + 0.587 * src[i + 1] + 0.114 * src[i + 2];
      }
    }

    function computeEdgeMask(threshold, step) {
      const w = canvas.width;
      const h = canvas.height;
      const mask = new Uint8Array(w * h);

      for (let y = step; y < h - step; y++) {
        for (let x = step; x < w - step; x++) {
          const gx =
            -1 * grayData[(y - step) * w + (x - step)] +
             1 * grayData[(y - step) * w + (x + step)] +
            -2 * grayData[y * w + (x - step)] +
             2 * grayData[y * w + (x + step)] +
            -1 * grayData[(y + step) * w + (x - step)] +
             1 * grayData[(y + step) * w + (x + step)];

          const gy =
            -1 * grayData[(y - step) * w + (x - step)] -
             2 * grayData[(y - step) * w + x] -
             1 * grayData[(y - step) * w + (x + step)] +
             1 * grayData[(y + step) * w + (x - step)] +
             2 * grayData[(y + step) * w + x] +
             1 * grayData[(y + step) * w + (x + step)];

          if (Math.sqrt(gx * gx + gy * gy) > threshold) {
            mask[y * w + x] = 1;
          }
        }
      }
      return mask;
    }

    function renderFullStencil() {
      if (!grayData) return;

      const w = canvas.width;
      const h = canvas.height;

      // 1. Fehér lap
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);

      // 2. Lightbox átfedés (eredeti fotó halványan alá)
      const lbAlpha = parseInt(lightboxSlider.value) / 100;
      if (lbAlpha > 0) {
        ctx.save();
        ctx.globalAlpha = lbAlpha;
        if (isFlipped) {
          ctx.scale(-1, 1);
          ctx.drawImage(originalImage, -w, 0);
        } else {
          ctx.drawImage(originalImage, 0, 0);
        }
        ctx.restore();
      }

      // 3. Stencil vonalak kinyerése
      const l1Active = l1Enable.checked;
      const mask1 = l1Active ? computeEdgeMask(parseInt(l1Thresh.value), parseInt(l1Thick.value)) : null;

      const l2Active = l2Enable.checked;
      const mask2 = l2Active ? computeEdgeMask(parseInt(l2Thresh.value), 1) : null;
      const l2Alpha = parseInt(l2Opacity.value) / 100;

      const outData = ctx.getImageData(0, 0, w, h);
      const out = outData.data;

      for (let i = 0; i < w * h; i++) {
        let darken = 0;
        if (mask1 && mask1[i]) {
          darken = 1;
        } else if (mask2 && mask2[i]) {
          darken = l2Alpha;
        }

        if (darken > 0) {
          const p = i * 4;
          out[p] = Math.round(out[p] * (1 - darken));
          out[p + 1] = Math.round(out[p + 1] * (1 - darken));
          out[p + 2] = Math.round(out[p + 2] * (1 - darken));
        }
      }

      ctx.putImageData(outData, 0, 0);

      // 4. Kézi radír és toll réteg
      ctx.drawImage(manualLayerCanvas, 0, 0);
    }

    // Zoom & Pásztázás transzformáció
    function updateTransform() {
      canvasWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      zoomVal.textContent = Math.round(scale * 100) + '%';
    }

    function resetZoomFit() {
      if (!canvas.width) return;
      const vRect = viewport.getBoundingClientRect();
      const sX = (vRect.width - 40) / canvas.width;
      const sY = (vRect.height - 40) / canvas.height;
      scale = Math.min(sX, sY, 1);
      panX = (vRect.width - canvas.width * scale) / 2;
      panY = (vRect.height - canvas.height * scale) / 2;
      updateTransform();
    }

    zoomInBtn.addEventListener('click', () => { scale = Math.min(scale * 1.25, 5); updateTransform(); });
    zoomOutBtn.addEventListener('click', () => { scale = Math.max(scale / 1.25, 0.1); updateTransform(); });
    zoomResetBtn.addEventListener('click', resetZoomFit);

    // Egérgörgős zoom
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      const newScale = Math.min(Math.max(scale * zoomFactor, 0.1), 6);

      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      panX = mouseX - (mouseX - panX) * (newScale / scale);
      panY = mouseY - (mouseY - panY) * (newScale / scale);
      scale = newScale;

      updateTransform();
    }, { passive: false });

    // Egérkoordináta a nagyított/mozgatott vásznon
    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    // Interakciók: Rajzolás / Mozgatás
    viewport.addEventListener('mousedown', (e) => {
      if (!grayData) return;

      if (currentTool === 'pan' || e.button === 1 || e.spaceKey) {
        isPanning = true;
        startPanX = e.clientX - panX;
        startPanY = e.clientY - panY;
        viewport.style.cursor = 'grabbing';
      } else {
        isDrawing = true;
        saveUndo();
        drawAction(e);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - startPanX;
        panY = e.clientY - startPanY;
        updateTransform();
      } else if (isDrawing) {
        drawAction(e);
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      isDrawing = false;
      viewport.style.cursor = currentTool === 'pan' ? 'grab' : 'crosshair';
    });

    function drawAction(e) {
      const pos = getCanvasPos(e);
      const size = parseInt(brushSizeSlider.value, 10);

      manualCtx.beginPath();
      manualCtx.arc(pos.x, pos.y, size / 2, 0, Math.PI * 2);

      if (currentTool === 'eraser') {
        manualCtx.fillStyle = '#ffffff'; // Kitörli az összecsomósodott részeket
      } else if (currentTool === 'brush') {
        manualCtx.fillStyle = '#000000'; // Új vonalat húz
      }
      manualCtx.fill();

      renderFullStencil();
    }

    function saveUndo() {
      if (undoHistory.length > 10) undoHistory.shift();
      undoHistory.push(manualCtx.getImageData(0, 0, manualLayerCanvas.width, manualLayerCanvas.height));
    }

    undoBtn.addEventListener('click', () => {
      if (undoHistory.length > 0) {
        manualCtx.putImageData(undoHistory.pop(), 0, 0);
        renderFullStencil();
      }
    });

    // Tükrözés
    flipBtn.addEventListener('click', () => {
      if (!originalImage) return;
      isFlipped = !isFlipped;

      // Puffer tükrözése is
      const temp = document.createElement('canvas');
      temp.width = manualLayerCanvas.width;
      temp.height = manualLayerCanvas.height;
      const tCtx = temp.getContext('2d');
      tCtx.drawImage(manualLayerCanvas, 0, 0);

      manualCtx.clearRect(0, 0, manualLayerCanvas.width, manualLayerCanvas.height);
      manualCtx.save();
      manualCtx.scale(-1, 1);
      manualCtx.drawImage(temp, -manualLayerCanvas.width, 0);
      manualCtx.restore();

      computeGrayscale();
      renderFullStencil();
    });

    // Eszközváltók
    toolEraser.addEventListener('click', () => setTool('eraser'));
    toolBrush.addEventListener('click', () => setTool('brush'));
    toolPan.addEventListener('click', () => setTool('pan'));

    function setTool(tool) {
      currentTool = tool;
      [toolEraser, toolBrush, toolPan].forEach(b => b.classList.remove('active'));
      if (tool === 'eraser') toolEraser.classList.add('active');
      if (tool === 'brush') toolBrush.classList.add('active');
      if (tool === 'pan') toolPan.classList.add('active');
      viewport.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
    }

    // Csúszkák frissítése
    [l1Thresh, l1Thick, l2Thresh, l2Opacity, lightboxSlider].forEach(el => {
      el.addEventListener('input', () => {
        l1ThreshVal.textContent = l1Thresh.value;
        l1ThickVal.textContent = l1Thick.value;
        l2ThreshVal.textContent = l2Thresh.value;
        l2OpacityVal.textContent = l2Opacity.value + '%';
        lightboxVal.textContent = lightboxSlider.value + '%';
        renderFullStencil();
      });
    });
    [l1Enable, l2Enable].forEach(el => el.addEventListener('change', renderFullStencil));
    brushSizeSlider.addEventListener('input', () => {
      brushSizeVal.textContent = brushSizeSlider.value + 'px';
    });

    // Mentés (Mindig tiszta fehér alapon, az átvilágítás nélkül menti el a stencilt!)
    downloadBtn.addEventListener('click', () => {
      const currentLb = lightboxSlider.value;
      lightboxSlider.value = 0;
      renderFullStencil();

      const link = document.createElement('a');
      link.download = 'tetovalo_stencil_kesz.png';
      link.href = canvas.toDataURL('image/png');
      link.click();

      lightboxSlider.value = currentLb;
      renderFullStencil();
    });
  </script>
</body>
</html>
