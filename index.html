<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HP Stencil Studio Pro - Dragon Edition</title>
  <style>
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --accent: #6366f1;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --success: #10b981;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
      user-select: none;
    }
    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 1.6rem; }
    p.sub { color: var(--muted); font-size: 0.85rem; }

    .main-layout {
      width: 100%;
      max-width: 1350px;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 16px;
      height: calc(100vh - 90px);
    }

    .sidebar {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      overflow-y: auto;
    }

    .layer-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .layer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slider-group label {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .tool-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tool-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #2a2a32;
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .tool-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .file-input-wrapper { position: relative; width: 100%; }
    .file-input-wrapper input[type="file"] {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
    }

    .viewport {
      background: #0d0d0f;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .viewport-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(30, 30, 36, 0.85);
      backdrop-filter: blur(8px);
      padding: 6px 10px;
      border-radius: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .vp-btn {
      background: transparent;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .vp-btn:hover { background: rgba(255,255,255,0.1); }
    .zoom-text { font-size: 0.8rem; color: var(--muted); min-width: 45px; text-align: center; }

    #canvasWrapper {
      position: absolute;
      transform-origin: 0 0;
      cursor: crosshair;
    }
    canvas {
      display: block;
      background: white;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <header>
    <h1>🐉 HP Stencil Studio Pro - Dragon Edition</h1>
    <p class="sub">Intelligens kontúrfelismerés & paca-mentesítés sűrű rajzokhoz és pikkelyekhez</p>
  </header>

  <div class="main-layout">
    <!-- BAL OLDAL -->
    <div class="sidebar">
      <div class="file-input-wrapper">
        <button class="btn" style="width: 100%;">📁 Sárkány / Kép betöltése</button>
        <input type="file" id="imageLoader" accept="image/*">
      </div>

      <!-- PACA-ELKERÜLŐ SZŰRŐ (ANTI-CLUTTER) -->
      <div class="layer-card" style="border-color: var(--warning);">
        <div class="layer-header">
          <span>🛡️ Pikkely & Zajszűrés (Paca ellen)</span>
        </div>
        <div class="slider-group">
          <label>Pikkely / Apró részlet tompítás: <span id="suppressVal">2</span></label>
          <input type="range" id="suppress" min="0" max="6" value="2">
        </div>
        <div class="slider-group">
          <label>Vonal tisztaság (Zajvágás): <span id="cleanVal">25</span></label>
          <input type="range" id="clean" min="5" max="80" value="25">
        </div>
      </div>

      <!-- KONTÚR VEZÉRLÉS -->
      <div class="layer-card">
        <div class="layer-header">
          <span>1. Fő körvonal felismerés</span>
        </div>
        <div class="slider-group">
          <label>Fővonal erősség: <span id="mainThreshVal">35</span></label>
          <input type="range" id="mainThresh" min="10" max="90" value="35">
        </div>
        <div class="slider-group">
          <label>Vonal vékonyság: <span id="thinVal">1 px</span></label>
          <input type="range" id="thin" min="1" max="3" value="1">
        </div>
      </div>

      <!-- ÁTVILÁGÍTÓ ASZTAL (LIGHTBOX) -->
      <div class="layer-card">
        <div class="layer-header">
          <span>💡 Átvilágító (Eredeti fotó alávetítése)</span>
        </div>
        <div class="slider-group">
          <label>Átlátszóság: <span id="lightboxVal">0%</span></label>
          <input type="range" id="lightbox" min="0" max="100" value="0">
        </div>
      </div>

      <!-- RETUS ESZKÖZÖK -->
      <div class="layer-card">
        <div class="layer-header">
          <span>🖌️ Kézi tisztítás & Radír</span>
        </div>
        <div class="tool-group">
          <button id="tool_eraser" class="tool-btn active">🧽 Radír</button>
          <button id="tool_brush" class="tool-btn">✏️ Toll</button>
          <button id="tool_pan" class="tool-btn">✋ Kéz</button>
        </div>
        <div class="slider-group" style="margin-top:6px;">
          <label>Radír / Toll méret: <span id="brushSizeVal">14px</span></label>
          <input type="range" id="brushSize" min="2" max="60" value="14">
        </div>
        <div class="tool-group" style="margin-top:6px;">
          <button id="flipBtn" class="tool-btn">🪞 Tükrözés</button>
          <button id="undoBtn" class="tool-btn" style="background:#374151;">↩️ Undo</button>
        </div>
      </div>

      <button id="downloadBtn" class="btn" style="background:var(--success); margin-top:auto;" disabled>💾 Paca-mentes Sablon Mentése</button>
    </div>

    <!-- JOBB OLDAL -->
    <div class="viewport" id="viewport">
      <div class="viewport-toolbar">
        <button class="vp-btn" id="zoomOut">➖</button>
        <span class="zoom-text" id="zoomVal">100%</span>
        <button class="vp-btn" id="zoomIn">➕</button>
        <button class="vp-btn" id="zoomReset">🎯</button>
      </div>

      <div id="canvasWrapper">
        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    const imageLoader = document.getElementById('imageLoader');
    const viewport = document.getElementById('viewport');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // Csúszkák
    const suppressSlider = document.getElementById('suppress');
    const cleanSlider = document.getElementById('clean');
    const mainThreshSlider = document.getElementById('mainThresh');
    const thinSlider = document.getElementById('thin');
    const lightboxSlider = document.getElementById('lightbox');
    const brushSizeSlider = document.getElementById('brushSize');

    // Értékjelzők
    const suppressVal = document.getElementById('suppressVal');
    const cleanVal = document.getElementById('cleanVal');
    const mainThreshVal = document.getElementById('mainThreshVal');
    const thinVal = document.getElementById('thinVal');
    const lightboxVal = document.getElementById('lightboxVal');
    const brushSizeVal = document.getElementById('brushSizeVal');
    const zoomVal = document.getElementById('zoomVal');

    // Eszközök
    const toolEraser = document.getElementById('tool_eraser');
    const toolBrush = document.getElementById('tool_brush');
    const toolPan = document.getElementById('tool_pan');
    const flipBtn = document.getElementById('flipBtn');
    const undoBtn = document.getElementById('undoBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    const zoomInBtn = document.getElementById('zoomIn');
    const zoomOutBtn = document.getElementById('zoomOut');
    const zoomResetBtn = document.getElementById('zoomReset');

    let originalImage = null;
    let isFlipped = false;
    let manualLayerCanvas = document.createElement('canvas');
    let manualCtx = manualLayerCanvas.getContext('2d');
    let undoHistory = [];

    // Zoom & Mozgatás állapot
    let scale = 1, panX = 0, panY = 0;
    let isPanning = false, isDrawing = false;
    let startPanX = 0, startPanY = 0;
    let currentTool = 'eraser';

    imageLoader.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          originalImage = img;
          isFlipped = false;
          canvas.width = img.width;
          canvas.height = img.height;

          manualLayerCanvas.width = img.width;
          manualLayerCanvas.height = img.height;
          manualCtx.clearRect(0, 0, img.width, img.height);
          undoHistory = [];

          resetZoomFit();
          processStencil();
          downloadBtn.disabled = false;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Paca-mentesítő intelligens élkereső algoritmus
    function processStencil() {
      if (!originalImage) return;

      const w = canvas.width;
      const h = canvas.height;

      // 1. Kép kirajzolása átmeneti pufferbe szürkeárnyalathoz
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = w;
      tempCanvas.height = h;
      const tCtx = tempCanvas.getContext('2d');

      tCtx.save();
      if (isFlipped) {
        tCtx.scale(-1, 1);
        tCtx.drawImage(originalImage, -w, 0);
      } else {
        tCtx.drawImage(originalImage, 0, 0);
      }
      tCtx.restore();

      const srcData = tCtx.getImageData(0, 0, w, h).data;
      const gray = new Float32Array(w * h);

      for (let i = 0, j = 0; i < srcData.length; i += 4, j++) {
        gray[j] = 0.299 * srcData[i] + 0.587 * srcData[i + 1] + 0.114 * srcData[i + 2];
      }

      // 2. DoG (Difference of Gaussians) szűrő:
      // Ez választja le a durva körvonalat az apró pikkelyektől!
      const blurRadius = parseInt(suppressSlider.value, 10);
      const threshold = parseInt(mainThreshSlider.value, 10);
      const cleanCutoff = parseInt(cleanSlider.value, 10);
      const step = parseInt(thinSlider.value, 10);

      // Két elmosott réteg készítése box-blurrel
      const smooth1 = boxBlur(gray, w, h, blurRadius > 0 ? blurRadius : 1);
      const smooth2 = boxBlur(gray, w, h, (blurRadius > 0 ? blurRadius : 1) * 2 + 1);

      // Fehér vászon alapozása
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);

      // Lightbox réteg
      const lbAlpha = parseInt(lightboxSlider.value, 10) / 100;
      if (lbAlpha > 0) {
        ctx.save();
        ctx.globalAlpha = lbAlpha;
        ctx.drawImage(tempCanvas, 0, 0);
        ctx.restore();
      }

      const outData = ctx.getImageData(0, 0, w, h);
      const out = outData.data;

      // 3. Kontúrok detektálása a frekvencia-különbségből
      for (let y = step; y < h - step; y++) {
        for (let x = step; x < w - step; x++) {
          const idx = y * w + x;

          // A két elmosás különbsége kiemeli az igazi éleket és eldobja a sűrű satírt
          const diff = smooth1[idx] - smooth2[idx];

          // Szomszédos gradiensek az élek megtartásához
          const gx = smooth1[y * w + (x + step)] - smooth1[y * w + (x - step)];
          const gy = smooth1[(y + step) * w + x] - smooth1[(y - step) * w + x];
          const grad = Math.sqrt(gx * gx + gy * gy);

          // Paca-védelem: Csak akkor teszünk fekete vonalat, ha erős a kontúr ÉS túllépi a tisztasági küszöböt
          let isEdge = false;
          if (diff < -cleanCutoff * 0.15 && grad > threshold) {
            isEdge = true;
          }

          if (isEdge) {
            const p = idx * 4;
            out[p] = 0;
            out[p + 1] = 0;
            out[p + 2] = 0;
          }
        }
      }

      ctx.putImageData(outData, 0, 0);

      // 4. Kézi radír és toll réteg rátétele
      ctx.drawImage(manualLayerCanvas, 0, 0);
    }

    // Gyors simító elmosás
    function boxBlur(data, w, h, r) {
      const output = new Float32Array(w * h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let sum = 0;
          let count = 0;
          for (let dy = -r; dy <= r; dy++) {
            const ny = y + dy;
            if (ny >= 0 && ny < h) {
              sum += data[ny * w + x];
              count++;
            }
          }
          output[y * w + x] = sum / count;
        }
      }
      return output;
    }

    // Csúszkák frissítése
    [suppressSlider, cleanSlider, mainThreshSlider, thinSlider, lightboxSlider].forEach(el => {
      el.addEventListener('input', () => {
        suppressVal.textContent = suppressSlider.value;
        cleanVal.textContent = cleanSlider.value;
        mainThreshVal.textContent = mainThreshSlider.value;
        thinVal.textContent = thinSlider.value + ' px';
        lightboxVal.textContent = lightboxSlider.value + '%';
        processStencil();
      });
    });

    // Zoom & Pan
    function updateTransform() {
      canvasWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      zoomVal.textContent = Math.round(scale * 100) + '%';
    }

    function resetZoomFit() {
      if (!canvas.width) return;
      const vRect = viewport.getBoundingClientRect();
      const sX = (vRect.width - 40) / canvas.width;
      const sY = (vRect.height - 40) / canvas.height;
      scale = Math.min(sX, sY, 1);
      panX = (vRect.width - canvas.width * scale) / 2;
      panY = (vRect.height - canvas.height * scale) / 2;
      updateTransform();
    }

    zoomInBtn.addEventListener('click', () => { scale = Math.min(scale * 1.25, 6); updateTransform(); });
    zoomOutBtn.addEventListener('click', () => { scale = Math.max(scale / 1.25, 0.1); updateTransform(); });
    zoomResetBtn.addEventListener('click', resetZoomFit);

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      const newScale = Math.min(Math.max(scale * zoomFactor, 0.1), 6);
      const rect = viewport.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      panX = mx - (mx - panX) * (newScale / scale);
      panY = my - (my - panY) * (newScale / scale);
      scale = newScale;
      updateTransform();
    }, { passive: false });

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    viewport.addEventListener('mousedown', (e) => {
      if (!originalImage) return;
      if (currentTool === 'pan' || e.button === 1) {
        isPanning = true;
        startPanX = e.clientX - panX;
        startPanY = e.clientY - panY;
        viewport.style.cursor = 'grabbing';
      } else {
        isDrawing = true;
        saveUndo();
        drawAction(e);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - startPanX;
        panY = e.clientY - startPanY;
        updateTransform();
      } else if (isDrawing) {
        drawAction(e);
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      isDrawing = false;
      viewport.style.cursor = currentTool === 'pan' ? 'grab' : 'crosshair';
    });

    function drawAction(e) {
      const pos = getCanvasPos(e);
      const size = parseInt(brushSizeSlider.value, 10);
      manualCtx.beginPath();
      manualCtx.arc(pos.x, pos.y, size / 2, 0, Math.PI * 2);
      manualCtx.fillStyle = currentTool === 'eraser' ? '#ffffff' : '#000000';
      manualCtx.fill();
      processStencil();
    }

    function saveUndo() {
      if (undoHistory.length > 10) undoHistory.shift();
      undoHistory.push(manualCtx.getImageData(0, 0, manualLayerCanvas.width, manualLayerCanvas.height));
    }

    undoBtn.addEventListener('click', () => {
      if (undoHistory.length > 0) {
        manualCtx.putImageData(undoHistory.pop(), 0, 0);
        processStencil();
      }
    });

    flipBtn.addEventListener('click', () => {
      if (!originalImage) return;
      isFlipped = !isFlipped;
      processStencil();
    });

    toolEraser.addEventListener('click', () => setTool('eraser'));
    toolBrush.addEventListener('click', () => setTool('brush'));
    toolPan.addEventListener('click', () => setTool('pan'));

    function setTool(tool) {
      currentTool = tool;
      [toolEraser, toolBrush, toolPan].forEach(b => b.classList.remove('active'));
      if (tool === 'eraser') toolEraser.classList.add('active');
      if (tool === 'brush') toolBrush.classList.add('active');
      if (tool === 'pan') toolPan.classList.add('active');
      viewport.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
    }

    brushSizeSlider.addEventListener('input', () => {
      brushSizeVal.textContent = brushSizeSlider.value + 'px';
    });

    downloadBtn.addEventListener('click', () => {
      const currentLb = lightboxSlider.value;
      lightboxSlider.value = 0;
      processStencil();

      const link = document.createElement('a');
      link.download = 'sarkany_stencil_tiszta.png';
      link.href = canvas.toDataURL('image/png');
      link.click();

      lightboxSlider.value = currentLb;
      processStencil();
    });
  </script>
</body>
</html>
